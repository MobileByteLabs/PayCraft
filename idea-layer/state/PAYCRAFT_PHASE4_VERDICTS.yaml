# PayCraft Phase 4 — per-consumer, per-platform release verdict grid (D10).
#
# This is the artefact D10 reads to decide whether the epic is done. Its whole purpose is to make
# "done" un-fakeable at the granularity where the previous epic failed: six green gates and 47 tasks
# that never reached a device (RESEARCH R8).
#
# THE RULE THAT MATTERS: a platform row may only be `green` if it carries its OWN capture_path.
# An iOS row can never inherit an Android capture — different binary, different store lane, different
# storefront API — and that inheritance is precisely how a paywall ships broken on one platform while
# a dashboard shows all-green.
#
# verdict vocabulary:
#   green                 bumped AND device-verified with a capture of THIS platform
#   bumped-not-verified   pin landed, no device capture yet (a publish is NOT rolled back by this)
#   pending-device-verify no device available; explicitly NOT a pass
#   out-of-scope          deliberately excluded, requires a stated reason

