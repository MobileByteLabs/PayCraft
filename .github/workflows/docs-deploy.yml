name: Deploy docs site → Cloudflare Pages

# Phase 2 T8 of paycraft-v2-production-readiness — builds Docusaurus on push
# to dev, uploads to Cloudflare Pages project `paycraft-docs`. Replaces the prior
# `docusaurus/`-targeted + GitHub-Pages-targeted variant.
#
# TWO SYSTEMS BUILD THIS SITE, and the earlier note here ("PR previews are handled
# by Cloudflare's GitHub integration") understated the second one:
#
#   1. THIS workflow  → `wrangler pages deploy` → Pages project `paycraft-docs`.
#      This is what SERVES production: docs.paycraft.mobilebytesensei.com is a
#      CNAME to paycraft-docs.pages.dev (infra/dns-records.md).
#   2. Cloudflare WORKERS BUILDS → builds docs-site/wrangler.toml on every push
#      to dev, not just PRs. It is not preview-only.
#
# Both are kept deliberately. Keep the distinction in mind before changing either:
# they share the name `paycraft-docs`, so a change that makes one authoritative
# silently demotes the other, and only this path is wired to DNS today.
#
# Trigger moved main → dev alongside deploy-cloud.yml: `dev` is the default
# branch and `main` stopped being promoted on 2026-08-03, leaving this dormant.
#
# CORRECTED 2026-09-23. The note here used to claim `--branch=main` was the Cloudflare Pages
# production alias. It is not — this project's `production_branch` is `dev`, so every run was
# publishing a PREVIEW deployment while docs.paycraft.mobilebytesensei.com kept serving a
# production build from 2026-09-19. The deploy reported success each time, which is why nobody
# noticed the site had stopped changing.
#
# `--branch` must match the project's production_branch to reach the custom domain. Verify with:
#   GET /accounts/{account}/pages/projects/paycraft-docs  →  .result.production_branch

on:
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22 to match deploy-cloud.yml. This job is NOT currently failing — it goes through
      # cloudflare/wrangler-action@v3, which supplies its own runtime, so wrangler's v22 floor has
      # not bitten here the way it did the dashboard deploy. Pinning 20 anyway leaves the same trap
      # armed for whenever that action stops shielding it, and there is no reason for the two
      # Cloudflare deploy paths in this repo to run different Node majors.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci`, matching docs-site/wrangler.toml#build.command. Two systems build this
      # same site; `npm install` may resolve a tree the lockfile does not describe, so the
      # two builders could ship different dependency sets from one commit — and only one of
      # them is wired to DNS, which is the hard kind of difference to notice.
      - name: Install deps
        working-directory: docs-site
        run: npm ci --no-audit --no-fund

      - name: Build site
        working-directory: docs-site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/build --project-name=paycraft-docs --branch=dev

      - name: Skip deploy if Cloudflare not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN not set — skipped Cloudflare Pages deploy."
          echo "::warning::Set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets in PayCraft repo settings."
          echo "::warning::Build artifact still produced at docs-site/build/ for manual upload."
