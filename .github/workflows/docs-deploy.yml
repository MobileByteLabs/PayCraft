name: Deploy docs site → Cloudflare Pages

# Phase 2 T8 of paycraft-v2-production-readiness — builds Docusaurus on push
# to dev, uploads to Cloudflare Pages project `paycraft-docs`. Replaces the prior
# `docusaurus/`-targeted + GitHub-Pages-targeted variant.
#
# ONE deploy path, matching every other site in this account.
#
# This workflow builds Docusaurus and runs `wrangler pages deploy` into the Pages project
# `paycraft-docs`; docs.paycraft.mobilebytesensei.com is a custom domain on that project.
# It is the same shape as deploy-cloud.yml, which deploys the Next.js app to the `paycraft`
# project serving paycraft / api.paycraft / mcp.paycraft. All Pages projects in this account
# have NO Git integration — GitHub Actions is the only publisher.
#
# It was not always one path. Until 2026-09-24 this site had THREE publishers racing on every
# push to dev: this workflow, a Cloudflare Pages Git integration, and a Cloudflare WORKERS BUILDS
# connection driven by docs-site/wrangler.toml. The Workers build failed in zero seconds on every
# push — it had no custom domain and had not deployed since 2026-08-24, so it published a red X
# to GitHub while changing nothing. The other two both succeeded and raced; last writer won.
#
# The Pages Git integration and the Workers Builds connection were disconnected, and
# docs-site/wrangler.toml (consumed ONLY by Workers Builds, and the sole wrangler.toml in the
# repo) was deleted with them. Restoring that file re-arms the duplicate path, so leave it gone
# unless you are deliberately moving this site off Pages.
#
# Trigger moved main → dev alongside deploy-cloud.yml: `dev` is the default
# branch and `main` stopped being promoted on 2026-08-03, leaving this dormant.
#
# CORRECTED 2026-09-23. The note here used to claim `--branch=main` was the Cloudflare Pages
# production alias. It is not — this project's `production_branch` is `dev`, so every run was
# publishing a PREVIEW deployment while docs.paycraft.mobilebytesensei.com kept serving a
# production build from 2026-09-19. The deploy reported success each time, which is why nobody
# noticed the site had stopped changing.
#
# `--branch` must match the project's production_branch to reach the custom domain. Verify with:
#   GET /accounts/{account}/pages/projects/paycraft-docs  →  .result.production_branch

on:
  push:
    branches: [dev]
    # Deliberately NO paths filter. The docs describe the API and the MCP server, so a change to
    # `dashboard/app/api/v1/**` or `lib/mcp-tools.ts` can invalidate a page in `docs/` without
    # touching it. A filter would mean the site silently describes the previous release — the same
    # class of failure as the `--branch=main` bug above: a green run and a stale site.
    # A docs build is ~90s; that is cheaper than documentation nobody can trust.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22 to match deploy-cloud.yml. This job is NOT currently failing — it goes through
      # cloudflare/wrangler-action@v3, which supplies its own runtime, so wrangler's v22 floor has
      # not bitten here the way it did the dashboard deploy. Pinning 20 anyway leaves the same trap
      # armed for whenever that action stops shielding it, and there is no reason for the two
      # Cloudflare deploy paths in this repo to run different Node majors.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci`, not `npm install` — it honours package-lock.json, so a CI build cannot
      # silently resolve a dependency tree different from the one committed.
      - name: Install deps
        working-directory: docs-site
        run: npm ci --no-audit --no-fund

      - name: Build site
        working-directory: docs-site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/build --project-name=paycraft-docs --branch=dev

      - name: Skip deploy if Cloudflare not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN not set — skipped Cloudflare Pages deploy."
          echo "::warning::Set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets in PayCraft repo settings."
          echo "::warning::Build artifact still produced at docs-site/build/ for manual upload."
