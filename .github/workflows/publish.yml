# Publish Workflow — delegates to mbl-actionhub reusable publish workflow
#
# Triggers:
#   - Schedule: every Monday 00:00 UTC
#   - Schedule: 1st of every month 00:00 UTC
#   - Manual dispatch: workflow_dispatch (optional specific module)
#
# To publish after a release tag, trigger manually via Actions → Publish → Run workflow.

name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # v2.0.0, v2.0.1, …
  schedule:
    - cron: '0 0 * * 1'   # weekly — every Monday 00:00 UTC
    - cron: '0 0 1 * *'   # monthly — 1st of every month 00:00 UTC
  workflow_dispatch:
    inputs:
      module:
        description: 'Specific module to publish (leave empty for all cmp-* modules)'
        required: false
        type: string

permissions:
  contents: write        # release creation + tag push (publish-kmp-library.yml)
  pull-requests: write   # publish-kmp-library.yml (≥v1.9.1) declares a bump-after-release
                         # job needing this; the perm is validated at startup even though
                         # the job is default-off — without it the run startup_failures.

jobs:
  publish:
    # v1.10.1, not v1.9.1: v1.9.1 runs the klib publish job on `macos-14`, which GitHub has retired —
    # run 42370521486 (2.4.10) had both publish jobs cancelled in 1s with no runner assigned. v1.10.1
    # moves it to macos-15 (and Linux jobs to ubuntu-26.04) with an identical input set; it is also the
    # pin PR Check + Gradle already use, so CI and release now build on the same images.
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/publish-kmp-library.yml@v1.10.1
    with:
      module-pattern: 'cmp-'
      module: ${{ inputs.module || '' }}
      group-id: 'io.github.mobilebytelabs'
      # artifact-id only drives version lookup + verify-against-maven (resolve.sh requires it); the
      # publish SET is discovered: every cmp-*/ module whose build has mavenPublishing → cmp-paycraft-core,
      # cmp-paycraft, cmp-paycraft-navigation. cmp-paycraft-web (+ its lazy cmp-paycraft-web-ui) has no mavenPublishing on purpose: it ships
      # vendored via /lib-integrate (Step 3W), never to Maven. For 3.0.0 cmp-paycraft-core has no Maven
      # history, so infra/release-coverage-check.sh compares paycraft.version with cmp-paycraft instead.
      artifact-id: 'cmp-paycraft-core'
      java-version: '21'
      java-distribution: 'zulu'
      sonatype-host: 'CENTRAL_PORTAL'
      create-github-release: true
      # Publish the version DECLARED in gradle.properties (paycraft.version), not an
      # auto-patch-bump off Maven/GitHub Releases. v1.0.12 lacked this, which shipped
      # 2.0.3 instead of the declared 2.1.0. v1.9.1+ resolves from gradle.properties.
      version-source: 'gradle-properties'
      gradle-properties-key: 'paycraft.version'

      # Fail EARLY when the declared version is <= what Maven Central already has, instead of
      # late at the upload with a Central rejection. kmp-toolkit has carried this; PayCraft did
      # not, which is how paycraft.version sat at 2.4.1 while 2.4.1 was already released — a
      # state nothing in the pipeline complained about until the next publish tried to redeploy
      # existing coordinates.
      verify-against-maven: true

      # ── Auto-bump for the next cycle ──────────────────────────────────────
      # After a successful publish + GH release, mbl-actionhub delegates to
      # mbl-actionhub-bump-version to open a PR bumping paycraft.version to the next
      # patch (2.4.1 → 2.4.2). Without `bump-after-release`, that job is default-off and
      # reports `skipped` — which is why every release since has left the version in
      # gradle.properties equal to the one already published, so the next publish had
      # nothing new to ship unless someone bumped it by hand.
      #
      # Want a minor/major next cycle instead? Close the auto-PR and bump manually, or
      # change `next-bump-type` here.
      bump-after-release: true
      next-bump-type: 'patch'

      # REQUIRED HERE, and the reason this block is not a copy of kmp-toolkit's.
      # The base branch defaults to GITHUB_REF_NAME, described upstream as "the branch the
      # publish workflow ran on". That holds for schedule/workflow_dispatch, which run on
      # `dev` — but this workflow ALSO triggers on `push: tags: v*`, and on a tag run
      # GITHUB_REF_NAME is the TAG (`v2.4.1`), not a branch. Left unset, a tag-triggered
      # release would open its bump PR against a branch named `v2.4.1`.
      # kmp-toolkit omits this input safely because it has no tag trigger; PayCraft does.
      bump-pr-base-branch: 'dev'
    secrets: inherit
