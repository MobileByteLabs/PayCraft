name: Production smoke tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test paycraft.mobilebytesensei.com
    runs-on: ubuntu-latest
    steps:
      # Needed only so the edge-function step can read supabase/.temp/project-ref. Deriving the
      # host from the committed ref keeps ONE source of truth for which project we talk to —
      # hardcoding the hostname here would re-create the duplicate that broke deploy-cloud for six
      # weeks, just in a different file.
      - uses: actions/checkout@v4

      - name: Landing page loads
        run: |
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://paycraft.mobilebytesensei.com/)
          [ "$STATUS" = "200" ] || (echo "Expected 200, got $STATUS" && exit 1)

      - name: Pricing page loads
        run: |
          BODY=$(curl -fsS https://paycraft.mobilebytesensei.com/pricing)
          echo "$BODY" | grep -q "Pro" || (echo "Pricing page missing 'Pro'" && exit 1)

      # This step asserted NOTHING. It curled `api.paycraft.mobilebytesensei.com`, which does not
      # resolve — infra/dns-records.md records it as "provisioned but unused, ships in v2.1" — for a
      # function named `v2-config`, which does not exist (the function is `config`). Both mistakes
      # were invisible because the command ended in `|| true` and the step only echoed the result,
      # so it reported success against a dead host and a wrong name. Measured 2026-09-19:
      #
      #   api.paycraft.mobilebytesensei.com/functions/v1/v2-config   000  (does not resolve)
      #   <ref>.supabase.co/functions/v1/v2-config                   404  (no such function)
      #   <ref>.supabase.co/functions/v1/config                      401  (deployed, auth enforced)
      #
      # 401 IS NOT A UNIVERSAL PASS — that assumption made this step green while every SDK endpoint
      # was broken in production (found 2026-09-22 from a user screenshot: the paywall rendered
      # "You appear to be offline" on a Play internal build over WiFi + LTE).
      #
      # The line above used to read "401 is the PASS signal for an anonymous probe: it proves the
      # function is deployed AND rejecting unauthenticated callers", and the measurement note above
      # records `config → 401 (deployed, auth enforced)` as the healthy state. That is right for a
      # function that SHOULD require a JWT, and exactly wrong for `config`, which is a PUBLIC
      # endpoint authenticated by the caller's publishable key (`?apiKey=pk_live_…`). For it, 401
      # means the Supabase gateway is rejecting the SDK before the function runs — the outage the
      # probe exists to detect, recorded as success.
      #
      # So the expectation is now PER FUNCTION, derived from the same source of truth the deploy
      # applies — `supabase/config.toml`:
      #
      #   verify_jwt = false (public)  → anonymous probe must NOT be 401. The function's own guard
      #                                  answers instead (config → 400 missing_apiKey). 401 FAILS.
      #   verify_jwt unset   (private) → 401 is correct and expected; 200 would be the surprise.
      #
      # Both directions fail closed: a public endpoint that starts demanding a JWT breaks the apps,
      # and a private one that stops demanding one is an exposure. 000/404 fail as before.
      - name: Edge functions reachable
        run: |
          set -uo pipefail
          REF="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          [ -n "$REF" ] || { echo "::error::supabase/.temp/project-ref is empty"; exit 1; }
          fail=0
          # Public = declared verify_jwt = false in config.toml. Read from the file rather than a
          # second hand-kept list, so adding a function to one and not the other cannot drift.
          PUBLIC="$(grep -B1 'verify_jwt = false' supabase/config.toml \
                    | grep -oE '\[functions\.[a-z-]+\]' | sed 's/\[functions\.//;s/\]//' | tr '\n' ' ')"
          echo "public (verify_jwt=false): ${PUBLIC}"
          # The question is NOT "which status code came back" — it is "did the request REACH the
          # function, or did the gateway reject it first?" Two reasons a status code alone cannot
          # answer that, both hit on 2026-09-22:
          #
          #   * Methods differ. `config` is GET; `checkout-initiate` / `register-*` are POST, so an
          #     anonymous GET probe gets 405 — which is a HEALTHY answer, proving the function ran.
          #     A first cut of this gate accepted only 200|400 and failed the deploy on that 405.
          #   * 401 is ambiguous. After the fix `config` answers 401 `{"error":"invalid_apiKey"}`
          #     ITSELF, which is correct behaviour and must pass; the gateway's pre-function refusal
          #     is ALSO 401. Identical status, opposite meanings.
          #
          # The BODY disambiguates them unambiguously. The Supabase gateway emits a machine-readable
          # `"code":"UNAUTHORIZED_*"` envelope; a function's own rejection never does. So: fail a
          # public function only when the gateway envelope is present, whatever the status.
          for fn in config checkout-initiate coupon-validate register-play-purchase register-appstore account-token billing; do
            BODY=$(curl -s --max-time 20 "https://${REF}.supabase.co/functions/v1/${fn}" || true)
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://${REF}.supabase.co/functions/v1/${fn}")
            case " $PUBLIC " in
              *" $fn "*) KIND=public ;;
              *)         KIND=private ;;
            esac
            # Did the GATEWAY refuse it before the function ran?
            case "$BODY" in
              *UNAUTHORIZED_NO_AUTH_HEADER*|*UNAUTHORIZED_INVALID_JWT_FORMAT*) GATED=yes ;;
              *) GATED=no ;;
            esac
            case "$CODE" in
              000) echo "::error::${fn}: unreachable (000) — host did not respond"; fail=1; continue ;;
              404) echo "::error::${fn}: 404 — function is not deployed under that name"; fail=1; continue ;;
            esac
            if [ "$KIND" = public ] && [ "$GATED" = yes ]; then
              echo "::error::${fn}: gateway rejected the call BEFORE the function ran (${CODE}, UNAUTHORIZED_*) although config.toml declares verify_jwt=false. This is the 'You appear to be offline' outage — the function's own guard should have answered."
              fail=1
            elif [ "$KIND" = private ] && [ "$GATED" = no ]; then
              echo "::error::${fn}: reached the function on an anonymous probe (${CODE}) but config.toml does NOT declare verify_jwt=false — gateway auth appears to be off for a private function"
              fail=1
            elif [ "$KIND" = public ]; then
              echo "  ok   ${fn}: ${CODE} (public, reached the function's own guard)"
            else
              echo "  ok   ${fn}: ${CODE} (private, gateway JWT enforced as declared)"
            fi
          done
          exit $fail

      # `/auth/login`, not `/auth/signin`. This step asserted a route that has never existed:
      # dashboard/app/auth/ contains callback, login, logout and signup — no `signin`. Live probe
      # on 2026-09-19: /auth/signin → 404, /auth/login → 200.
      #
      # It went unnoticed because this whole job had never run. It is gated behind the dashboard
      # deploy, which had been failing since 2026-08-03, so the first execution was also the first
      # time anyone saw the assertion — and it read as "production auth is down" when the site was
      # healthy and the test was wrong.
      - name: Auth page reachable
        run: |
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" \
            https://paycraft.mobilebytesensei.com/auth/login)
          [ "$STATUS" = "200" ] || (echo "Auth page returned $STATUS" && exit 1)

      # Slack notification removed 2026-09-19. SLACK_BOT_TOKEN was never set, so both steps threw
      # `Missing input! Either a method or webhook is required to take action.` — the step whose job
      # was to ANNOUNCE a failure was itself failing, and it added a second red step to every run,
      # making one real smoke finding look like two. A reporting path nobody exercises is worse than
      # no reporting path: it converts silence into false confidence. Job status in the Actions UI is
      # the signal; re-add a notifier only alongside the secret that makes it work.
