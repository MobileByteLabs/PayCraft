name: Production smoke tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test paycraft.mobilebytesensei.com
    runs-on: ubuntu-latest
    steps:
      # Needed only so the edge-function step can read supabase/.temp/project-ref. Deriving the
      # host from the committed ref keeps ONE source of truth for which project we talk to —
      # hardcoding the hostname here would re-create the duplicate that broke deploy-cloud for six
      # weeks, just in a different file.
      - uses: actions/checkout@v4

      - name: Landing page loads
        run: |
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://paycraft.mobilebytesensei.com/)
          [ "$STATUS" = "200" ] || (echo "Expected 200, got $STATUS" && exit 1)

      - name: Pricing page loads
        run: |
          BODY=$(curl -fsS https://paycraft.mobilebytesensei.com/pricing)
          echo "$BODY" | grep -q "Pro" || (echo "Pricing page missing 'Pro'" && exit 1)

      # Edge-function reachability — implemented ONCE, in scripts/deploy-cloud.sh, which the
      # deploy itself also runs. Inlining it here meant the probe guarding a deploy and the probe a
      # developer can run locally were two different programs, and they disagreed.
      #
      # Two defects this step has actually shipped, kept as the reason it is now delegated:
      #   • It curled `api.paycraft.mobilebytesensei.com/functions/v1/v2-config` — a host that does
      #     not resolve, for a function that does not exist (it is `config`) — ending in `|| true`,
      #     so it reported success against both mistakes for weeks.
      #   • It then accepted 401 as healthy for EVERY function, on the reasoning that 401 proves a
      #     function is deployed and rejecting anonymous callers. True for a private function;
      #     exactly inverted for `config`, a PUBLIC endpoint authenticated by the caller's
      #     publishable key. A total SDK outage stayed green until a user photographed a phone
      #     rendering "You appear to be offline" over WiFi + LTE (2026-09-22).
      #
      # The expectation is now per-function, derived from supabase/config.toml's verify_jwt blocks —
      # the same file the deploy applies — and fails closed in both directions.
      - name: Edge functions reachable
        run: bash scripts/deploy-cloud.sh --smoke-only

      # 200 IS NOT ENOUGH FOR A CLIENT-RENDERED PAGE — and neither is grepping the HTML.
      #
      # On 2026-09-23 /auth/login was completely unusable while this step was green. The HTML is
      # server-rendered correctly ("Sign in to your dashboard", OAuth buttons, all present) and
      # returns 200; the failure happens on HYDRATION, when the browser bundle calls
      # createBrowserClient with undefined and React replaces the tree with "Application error: a
      # client-side exception has occurred". That string is injected client-side and NEVER appears
      # in the response, so no amount of curl-grepping the page can see it.
      #
      # What curl CAN see is the cause. `next build` inlines NEXT_PUBLIC_* into the JS chunks, so a
      # correctly-built bundle literally contains the Supabase project ref. Measured on the broken
      # deploy: 0 of 9 chunks contained it. Asserting its presence tests the exact thing that
      # failed, needs no browser, and cannot silently pass the way a status check did.
      - name: Auth page reachable AND browser env was inlined
        run: |
          REF="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          BODY=$(curl -fsS https://paycraft.mobilebytesensei.com/auth/login)
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" \
            https://paycraft.mobilebytesensei.com/auth/login)
          [ "$STATUS" = "200" ] || { echo "::error::Auth page returned $STATUS"; exit 1; }

          hits=0
          for c in $(printf '%s' "$BODY" | grep -oE '/_next/static/chunks/[A-Za-z0-9._/-]+\.js' | sort -u); do
            if curl -fsS "https://paycraft.mobilebytesensei.com${c}" 2>/dev/null | grep -q "$REF"; then
              hits=$((hits+1))
            fi
          done
          if [ "$hits" -eq 0 ]; then
            echo "::error::No JS chunk contains the Supabase project ref — NEXT_PUBLIC_SUPABASE_URL was not set at BUILD time. The page will return 200 and then throw on hydration; nobody can log in."
            exit 1
          fi
          echo "browser env inlined (ref found in ${hits} chunk(s))"

      # The live security properties, re-checked after every deploy.
      #
      # These are the checks that found the two real issues they now guard: an unauthenticated 500
      # naming SUPABASE_SERVICE_ROLE_KEY, and /api/health publishing which variable was missing at
      # exactly the moment it was. The unit tests scan SOURCE and see only literal leaks; this
      # probes the live response, so it also catches a name interpolated at runtime.
      #
      # SKIP_AUTHED: no vault in CI, so the authenticated checks are skipped rather than faked.
      # The 17 public checks still run, and a fake-green check would be worse than a skipped one.
      - name: Security audit (public checks)
        env:
          SKIP_AUTHED: '1'
        run: bash scripts/security-audit.sh

      # Slack notification removed 2026-09-19. SLACK_BOT_TOKEN was never set, so both steps threw
      # `Missing input! Either a method or webhook is required to take action.` — the step whose job
      # was to ANNOUNCE a failure was itself failing, and it added a second red step to every run,
      # making one real smoke finding look like two. A reporting path nobody exercises is worse than
      # no reporting path: it converts silence into false confidence. Job status in the Actions UI is
      # the signal; re-add a notifier only alongside the secret that makes it work.
