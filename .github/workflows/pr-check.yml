# PR Check Workflow — fast gate on pull requests
# Runs quality + JVM tests only (iOS/Linux skipped for speed).
# Full build (all targets) runs on push to dev/main via gradle.yml.

name: PR Check

on:
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    # TEMP: mbl-actionhub PR 22 (compile split into Linux + Apple jobs, actions on Node 24) — pin to its release
    # tag once that PR is merged and tagged.
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@session-mbl-actionhub-20261127184702177
    with:
      module-pattern: 'cmp-'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true
      run-ios-tests: false
      run-linux-tests: false
