# PR Check Workflow — fast gate on pull requests
# Runs quality + JVM tests only (iOS/Linux skipped for speed).
# Full build (all targets) runs on push to dev/main via gradle.yml.

name: PR Check

on:
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    # v1.12.0: compile split into a Linux job (JVM/Android/Web) and an Apple compile-only job; actions on Node 24.
    uses: MobileByteLabs/mbl-actionhub/.github/workflows/ci-kmp-library.yml@v1.12.0
    with:
      module-pattern: 'cmp-'
      java-version: '21'
      java-distribution: 'zulu'
      run-quality: true
      run-ios-tests: false
      run-linux-tests: false
