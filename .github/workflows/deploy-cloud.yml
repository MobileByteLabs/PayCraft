name: Deploy PayCraft — Supabase, dashboard, docs

# ONE deploy unit for everything that ships from this repo to production:
#
#   supabase          → migrations + edge functions
#   deploy-dashboard  → Pages project `paycraft`      — paycraft / api.paycraft / mcp.paycraft
#   deploy-docs       → Pages project `paycraft-docs` — docs.paycraft
#   smoke             → cloud-smoke.yml against the live dashboard
#
# api. and mcp. are CUSTOM DOMAINS on the `paycraft` project, not separate deploys — the same
# Next.js app answers all three hostnames and routes by path. There is nothing to deploy for
# them independently.
#
# The docs job arrived here on 2026-09-24 from a standalone docs-deploy.yml. It was not merely
# tidier: that site had THREE publishers racing on every push to dev (this repo's workflow, a
# Cloudflare Pages Git integration, and a Cloudflare Workers Builds connection that failed in
# zero seconds while owning no domain). Both Cloudflare-side connections were disconnected and
# their config deleted; folding the workflow in leaves exactly one publisher per host, declared
# in one file.
#
# Renaming this workflow is safe as of 2026-09-24 — `dev` branch protection requires only the
# `zero-leak` check, so no required-status-check name depends on it. Re-verify before renaming
# again: GET /repos/{owner}/{repo}/branches/dev/protection → .required_status_checks.contexts
#
# Trigger is `dev`, the repository's DEFAULT branch — every PR merges there.
# This previously fired on `main`, which stopped being promoted on 2026-08-03:
# `main` fell 140 commits behind and still carries the pre-Cloudflare (Vercel)
# copy of this workflow, so all 8 recorded runs failed and production shipped
# only from `infra/deploy/deploy.sh` on a laptop — skipping the migrations-first
# ordering below and the smoke job at the bottom.
#
# NOTE: the `--branch=main` in `dashboard/package.json#pages:deploy` is the
# CLOUDFLARE PAGES production-branch alias, not a git branch. It must stay
# `main` — changing it to `dev` would demote these to PREVIEW deployments and
# paycraft.mobilebytesensei.com would stop updating.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual deploy)'
        type: boolean
        default: false

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  # Schema FIRST — apply any pending migrations to the prod DB BEFORE the dashboard
  # / edge functions deploy, so new code never lands against an un-migrated schema
  # (a new column/RPC the dashboard reads would otherwise 500 until someone runs
  # `supabase db push` by hand). db push is idempotent — it only applies migrations
  # not already in supabase_migrations.schema_migrations — and our migrations are
  # IF-NOT-EXISTS guarded, so a re-run is a no-op.
  #
  # Requires repo secret SUPABASE_DB_PASSWORD (the prod Postgres password) in
  # addition to the SUPABASE_ACCESS_TOKEN the functions job uses. The project REF is not a
  # secret and is no longer read from one — it comes from supabase/.temp/project-ref.
  supabase:
    name: Supabase — migrations + edge functions + smoke
    runs-on: ubuntu-latest
    if: github.event.inputs.dry_run != 'true'
    # ONE SOURCE OF TRUTH. This job used to be THREE (deploy-migrations, deploy-functions, smoke),
    # each inlining its own copy of the same steps — and the copies drifted. The function list was a
    # hardcoded array here while the local path globbed the directory, so CI silently skipped every
    # function nobody had remembered to add. Both paths now run scripts/deploy-cloud.sh, so a fix
    # lands once and a developer can reproduce CI exactly with one command.
    steps:
      - uses: actions/checkout@v4

      # PINNED, not `latest`. `version: latest` makes setup-cli query the GitHub releases API
      # unauthenticated — 60 requests/hour shared across every runner on that IP — and run
      # 35456897180 died on it: "Failed to resolve latest Supabase CLI release: rate limit exceeded".
      # The job failed before a single one of its own steps ran, so the deploy looked broken when
      # nothing in this repo had changed.
      #
      # Pinning also removes a quieter hazard: this is the PRODUCTION migration path, and `latest`
      # lets an upstream CLI release change how it behaves with no commit on our side. Bump this
      # deliberately, the same way any other dependency gets bumped. The script WARNS when the local
      # CLI differs from this pin, so the two cannot diverge unnoticed.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Assert the secret is non-empty BEFORE touching the CLI. A missing repo secret interpolates
      # to an empty string, not an error: the 2026-08-03 runs shipped `supabase link --project-ref ""`
      # with a blank token and reported success.
      - name: Assert deploy secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || {
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is empty or unset"; exit 1; }

      - name: Deploy (migrations → functions → smoke)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/deploy-cloud.sh

  deploy-dashboard:
    name: Deploy Next.js dashboard to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [supabase]
    if: github.event.inputs.dry_run != 'true'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: `pages:deploy` invokes wrangler directly, and wrangler enforces a hard
      # floor — "Wrangler requires at least Node.js v22.0.0. You are using v20.20.2." The
      # next-on-pages BUILD succeeds on 20 and the failure lands afterwards, on the upload, so the
      # log reads as a deploy problem rather than a runtime-version one (2026-09-19 run 35447678934:
      # "Build completed in 25.99s" immediately followed by exit 1).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The dashboard is a STANDALONE Next.js app under dashboard/ (no root workspace).
      # Deploy target moved twice on 2026-08-23: Vercel → Workers/OpenNext → Pages/next-on-pages.
      # The second move deleted the cf:build/cf:preview/cf:deploy scripts and @opennextjs/cloudflare,
      # but this workflow kept invoking the deleted cf:deploy script — so every CI deploy since
      # has failed with `Missing script`, which also skipped the smoke job that depends on it.
      # Only the local infra/deploy/deploy.sh path (which calls pages:deploy) has been shipping.
      #
      # pages:deploy = `npx @cloudflare/next-on-pages@1 && wrangler pages deploy .vercel/output/static
      #                 --project-name=paycraft --branch=main`
      # (reads CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN below).
      - name: Install deps
        run: npm install

      # Derive the Supabase URL from the COMMITTED project ref — the same single source of truth
      # the migration job uses. Hardcoding the hostname here would be a second copy of "which
      # project are we", which is precisely the duplicate that broke deploy-cloud for six weeks.
      - name: Resolve Supabase URL
        id: sb
        working-directory: .
        run: |
          REF="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          printf '%s' "$REF" | grep -qE '^[a-z]{20}$' || {
            echo "::error::project ref '$REF' is malformed"; exit 1; }
          echo "url=https://${REF}.supabase.co" >> "$GITHUB_OUTPUT"

      # FAIL BEFORE BUILDING on an empty NEXT_PUBLIC_*.
      #
      # This is the check that was missing. `next build` inlines these into the browser bundle; an
      # UNSET one inlines as `undefined` and the build still succeeds. The failure then surfaces
      # only in a browser, as `@supabase/ssr: Your project's URL and API key are required`, on a
      # page that returns HTTP 200 with an empty body — so cloud-smoke's `/auth/login → 200`
      # assertion passed straight through a completely broken login page (measured 2026-09-23).
      - name: Assert browser-inlined env is present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is empty — the browser bundle would ship undefined and every page would throw at createBrowserClient"; exit 1; }
          done
          echo "browser env present: URL + ANON_KEY"

      - name: Build + deploy to Cloudflare Pages
        run: npm run pages:deploy
        env:
          # NEXT_PUBLIC_* is inlined by `next build`, so this must be set HERE at
          # build time — a Pages dashboard env var would be read too late. Without
          # it /api/health reports env "local" in production (route.ts falls back),
          # which is why a live build could not be told apart from a local one.
          NEXT_PUBLIC_APP_ENV: production
          # These two were MISSING while the comment above stated the rule. supabase-browser.ts
          # reads them via createBrowserClient, so every client page threw and rendered
          # "Application error: a client-side exception has occurred" — including /auth/login,
          # which locked the dashboard entirely.
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The org token materializes as CLOUDFLARE_PAGES_API_TOKEN (alias
          # mbs-cloudflare-pages-api-token); wrangler reads CLOUDFLARE_API_TOKEN.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}

  # docs.paycraft.mobilebytesensei.com — Docusaurus → Pages project `paycraft-docs`.
  #
  # Moved here from a standalone docs-deploy.yml on 2026-09-24. Same trigger, same runner, same
  # wrangler call; what changes is that the docs now ship as part of ONE deploy unit with the app
  # they document, rather than as a parallel workflow that happened to share a trigger.
  #
  # `needs: [deploy-dashboard]` is deliberate and IS a behavior change: the standalone workflow
  # published unconditionally, so a failed dashboard deploy still shipped docs describing the
  # release that did not land. This is the same ordering rule the supabase job states above —
  # never let one half of a release describe a state the other half never reached.
  #
  # The trade-off: a docs-only typo fix is now blocked by an unrelated Supabase or dashboard
  # failure. That is the intended direction (correct beats current), but it is why this job is
  # LAST — nothing depends on it, so `workflow_dispatch` re-runs it alone once the blocker clears.
  #
  # NOTE ON `--branch=dev`: unlike the dashboard's `--branch=main` above, this is NOT a mismatch.
  # `--branch` must equal each Pages project's OWN production_branch, which is the alias wired to
  # the custom domain: `paycraft` uses `main`, `paycraft-docs` uses `dev`. Getting it wrong
  # publishes a PREVIEW and the live site silently stops changing while every run reports success
  # — which is exactly what happened to this site between 2026-09-19 and 2026-09-23. Verify with:
  #   GET /accounts/{account}/pages/projects/paycraft-docs  →  .result.production_branch
  #
  # TOKEN: this job uses CLOUDFLARE_API_TOKEN while deploy-dashboard uses
  # CLOUDFLARE_PAGES_API_TOKEN. Both secrets exist and each is the one its job has been deploying
  # with. They are NOT consolidated here because the scopes have not been confirmed equivalent,
  # and swapping a working token for tidiness is how a green pipeline starts failing.
  deploy-docs:
    name: Deploy docs site to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [deploy-dashboard]
    if: github.event.inputs.dry_run != 'true'
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      # Node 22 to match deploy-dashboard — wrangler enforces a hard v22 floor, and there is no
      # reason for the two Cloudflare deploy jobs in one workflow to run different Node majors.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci`, not `npm install` — it honours package-lock.json, so a CI build cannot silently
      # resolve a dependency tree different from the one committed.
      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build

      # Assert BEFORE deploying, matching the supabase job's pattern above: an unset repo secret
      # interpolates to an empty string rather than erroring, and wrangler with an empty token
      # fails in a way that reads as a Cloudflare problem rather than a missing-secret one.
      # The standalone workflow warned and SKIPPED here, which meant a misconfigured deploy
      # reported success and the site quietly stopped updating.
      - name: Assert Cloudflare secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!v}" ] || { echo "::error::$v repo secret is empty or unset"; exit 1; }
          done

      # PATH IS REPO-ROOT-RELATIVE, hence `docs-site/build` and not `build`.
      # `defaults.run.working-directory` above applies ONLY to `run:` steps — a `uses:` step
      # ignores it entirely, so this action starts at the repo root no matter what the job
      # default says. Writing `build` here resolves to ./build, which does not exist, and the
      # failure reads as a wrangler problem rather than a path one.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/build --project-name=paycraft-docs --branch=dev

  smoke:
    name: Run production smoke tests
    needs: [deploy-dashboard]
    uses: ./.github/workflows/cloud-smoke.yml
    secrets: inherit
