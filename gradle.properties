#Gradle
# Kotlin daemon args live in `kotlin.daemon.jvmargs`, NOT in a -D inside org.gradle.jvmargs.
#
# The previous form was:
#   -Dkotlin.daemon.jvm.options\="-Xmx4096M -XX:MaxMetaspaceSize=768M"
#
# `kotlin.daemon.jvm.options` is parsed as a COMMA-separated list, so a space-separated value
# reaches the JVM as ONE argument and the daemon dies before it compiles anything:
#   Invalid maximum heap size: -Xmx4096M -XX:MaxMetaspaceSize=768M
#   Error: Could not create the Java Virtual Machine.
# Gradle retries three times, then the task fails. `kotlin.daemon.jvmargs` is the first-class
# Kotlin Gradle property and takes SPACE-separated args, so it cannot hit that ambiguity at all.
#
# Only CI saw it: a developer whose GRADLE_USER_HOME gradle.properties sets org.gradle.jvmargs
# overrides this whole line, and a warm Kotlin daemon is reused rather than restarted with the
# broken value. It surfaced on the first PR to touch cmp-paycraft, because `Compile All Targets`
# is skipped when no library module changes.
org.gradle.jvmargs=-Xmx6144M -XX:MaxMetaspaceSize=1024M -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=768M
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Compose Experimental targets
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Publishing
paycraft.version=2.4.7
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true


# ── AGP 9 + a Compose-Multiplatform sample app ────────────────────────────────
# Since AGP 9.0 the 'com.android.application' plugin refuses to coexist with
# 'org.jetbrains.kotlin.multiplatform', and Google ships no
# 'com.android.kotlin.multiplatform.application' equivalent to move an app module to.
#
# :sample-app is DELIBERATELY a Kotlin Multiplatform + Compose Multiplatform application — one
# module targeting android / desktop / iOS / wasmJs from shared Compose code. That IS the thing the
# sample exists to demonstrate, so it is not something to trade away for a cleaner build file.
# Splitting the Android half into a plain non-KMP module was tried and reverted for exactly that
# reason: it builds, but it stops showing consumers how a real CMP app integrates PayCraft.
#
# These two flags are AGP's own documented escape hatch for this case — they keep the pre-AGP-9
# Kotlin integration + DSL, which is what a KMP application module still expects. :cmp-paycraft is
# unaffected either way (it uses com.android.kotlin.multiplatform.library).
#
# Remove these ONLY when AGP ships first-class KMP-application support.
android.builtInKotlin=false
android.newDsl=false
