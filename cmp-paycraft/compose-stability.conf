// Compose stability for cmp-paycraft-core's value types (paycraft-core-split).
//
// cmp-paycraft-core is built without the Compose compiler (it has no Compose), so its classes carry no
// stability metadata and, across the module boundary, read as unstable to the paywall composables here.
// The types below are immutable (`val`-only data classes / sealed types holding read-only lists), so they
// are declared stable. Note this is slightly MORE skipping than 2.5.2: types with List fields were inferred
// unstable there. Services (ConfigClient, ConfigCache, clients, repositories) are deliberately NOT listed.
// This file only affects code compiled in cmp-paycraft; apps can reuse it — see MIGRATION_3.0.md.
com.mobilebytelabs.paycraft.model.**
